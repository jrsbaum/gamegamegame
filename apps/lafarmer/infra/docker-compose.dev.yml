name: lafarmer-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lafarmer}
      POSTGRES_USER: ${POSTGRES_USER:-lafarmer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - lafarmer-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run dev --workspace=apps/server -- --host 0.0.0.0"
    ports:
      - "${SERVER_PORT:-3348}:3337"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: 3337
      DATABASE_URL: postgresql://${POSTGRES_USER:-lafarmer}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-lafarmer}
    volumes:
      - ..:/workspace
      - lafarmer-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3337/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run dev --workspace=apps/web -- --hostname 0.0.0.0"
    ports:
      - "${WEB_PORT:-4328}:4327"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: 4327
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3348}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3348/ws}
    volumes:
      - ..:/workspace
      - lafarmer-node-modules:/workspace/node_modules
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4327/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  lafarmer-postgres-dev:
  lafarmer-node-modules:
