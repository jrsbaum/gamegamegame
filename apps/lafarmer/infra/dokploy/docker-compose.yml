name: lafarmer

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lafarmer-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  server:
    build:
      context: ../..
      dockerfile: infra/docker/server.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: https://${WEB_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.lafarmer-server.rule: Host(`${WEB_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || Path(`/healthz`))
      traefik.http.routers.lafarmer-server.entrypoints: websecure
      traefik.http.routers.lafarmer-server.tls: "true"
      traefik.http.routers.lafarmer-server.tls.certresolver: letsencrypt
      traefik.http.routers.lafarmer-server.priority: "100"
      traefik.http.services.lafarmer-server.loadbalancer.server.port: "4000"

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_SERVER_URL: https://${WEB_DOMAIN}
      NEXT_PUBLIC_WS_URL: wss://${WEB_DOMAIN}/ws
    depends_on:
      server:
        condition: service_healthy
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.lafarmer-web.rule: Host(`${WEB_DOMAIN}`)
      traefik.http.routers.lafarmer-web.entrypoints: websecure
      traefik.http.routers.lafarmer-web.tls: "true"
      traefik.http.routers.lafarmer-web.tls.certresolver: letsencrypt
      traefik.http.routers.lafarmer-web.priority: "10"
      traefik.http.services.lafarmer-web.loadbalancer.server.port: "80"

volumes:
  lafarmer-postgres:

networks:
  internal:
    driver: bridge
    internal: true
  proxy:
    external: true
    name: dokploy-network
