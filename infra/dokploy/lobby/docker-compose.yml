name: gamegamegame-lobby

services:
  lobby:
    build:
      context: ../../..
      dockerfile: infra/docker/lobby.Dockerfile
    environment:
      NODE_ENV: production
      GAME_SERVICE: lobby
      HOST: 0.0.0.0
      PUBLIC_ORIGIN: https://${LOBBY_DOMAIN}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 8s
    restart: unless-stopped
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.gamegamegame-lobby.rule: Host(`${LOBBY_DOMAIN}`)
      traefik.http.routers.gamegamegame-lobby.entrypoints: websecure
      traefik.http.routers.gamegamegame-lobby.tls: "true"
      traefik.http.routers.gamegamegame-lobby.tls.certresolver: letsencrypt
      traefik.http.services.gamegamegame-lobby.loadbalancer.server.port: "80"

networks:
  proxy:
    external: true
    name: dokploy-network
