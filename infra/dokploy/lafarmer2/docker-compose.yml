name: gamegamegame-lafarmer2

services:
  server:
    build:
      context: ../../..
      dockerfile: infra/docker/lafarmer2-server.Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3338
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CORS_ORIGIN: https://${WEB_DOMAIN:?WEB_DOMAIN is required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3338/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      private:
        aliases:
          - lafarmer2-backend

  web:
    build:
      context: ../../..
      dockerfile: infra/docker/lafarmer2-web.Dockerfile
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - private
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.gamegamegame-lafarmer2-web.rule: Host(`${WEB_DOMAIN:?WEB_DOMAIN is required}`)
      traefik.http.routers.gamegamegame-lafarmer2-web.entrypoints: websecure
      traefik.http.routers.gamegamegame-lafarmer2-web.tls: "true"
      traefik.http.routers.gamegamegame-lafarmer2-web.tls.certresolver: letsencrypt
      traefik.http.services.gamegamegame-lafarmer2-web.loadbalancer.server.port: "80"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - type: volume
        source: lafarmer2-postgres
        target: /var/lib/postgresql/data
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - private

volumes:
  lafarmer2-postgres:
    external: true
    name: ${LAFARMER2_POSTGRES_VOLUME:?LAFARMER2_POSTGRES_VOLUME is required}

networks:
  private:
    internal: true
  proxy:
    external: true
    name: dokploy-network
