name: gamegamegame-lafarmer2-hml

services:
  server:
    build:
      context: ../../..
      dockerfile: infra/docker/lafarmer2-server.Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3338
      DATABASE_URL: postgresql://lafarmer2_hml:${LAFARMER2_HML_POSTGRES_PASSWORD:?LAFARMER2_HML_POSTGRES_PASSWORD is required}@postgres:5432/lafarmer2_hml
      SESSION_SECRET: ${LAFARMER2_HML_SESSION_SECRET:?LAFARMER2_HML_SESSION_SECRET is required}
      CORS_ORIGIN: https://hml-lafarmer2.gamegamegame.site
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3338/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      private:
        aliases:
          - lafarmer2-backend

  web:
    build:
      context: ../../..
      dockerfile: infra/docker/lafarmer2-web.Dockerfile
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - private
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.gamegamegame-lafarmer2-hml-web.rule: Host(`hml-lafarmer2.gamegamegame.site`)
      traefik.http.routers.gamegamegame-lafarmer2-hml-web.entrypoints: websecure
      traefik.http.routers.gamegamegame-lafarmer2-hml-web.tls: "true"
      traefik.http.routers.gamegamegame-lafarmer2-hml-web.tls.certresolver: letsencrypt
      traefik.http.services.gamegamegame-lafarmer2-hml-web.loadbalancer.server.port: "80"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lafarmer2_hml
      POSTGRES_USER: lafarmer2_hml
      POSTGRES_PASSWORD: ${LAFARMER2_HML_POSTGRES_PASSWORD:?LAFARMER2_HML_POSTGRES_PASSWORD is required}
    volumes:
      - type: volume
        source: lafarmer2-hml-postgres
        target: /var/lib/postgresql/data
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lafarmer2_hml -d lafarmer2_hml"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - private

volumes:
  lafarmer2-hml-postgres:
    external: true
    name: gamegamegame-staging-lafarmer2-postgres

networks:
  private:
    internal: true
  proxy:
    external: true
    name: dokploy-network
