name: gamegamegame-caracol

services:
  caracol:
    build:
      context: ../../..
      dockerfile: infra/docker/gamegamegame.Dockerfile
      args:
        GAME_APP: caracol
    environment:
      NODE_ENV: production
      GAME_SERVICE: caracol
      HOST: 0.0.0.0
      PORT: 3001
      PUBLIC_ORIGIN: https://${CARACOL_DOMAIN}
      VITE_SERVER_URL: ""
      CARACOL_DATABASE_URL: postgresql://caracol:${CARACOL_POSTGRES_PASSWORD}@postgres:5432/caracol
      CARACOL_VAPID_PUBLIC_KEY: ${CARACOL_VAPID_PUBLIC_KEY}
      CARACOL_VAPID_PRIVATE_KEY: ${CARACOL_VAPID_PRIVATE_KEY}
      CARACOL_VAPID_SUBJECT: ${CARACOL_VAPID_SUBJECT}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 8s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - private
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: caracol
      POSTGRES_USER: caracol
      POSTGRES_PASSWORD: ${CARACOL_POSTGRES_PASSWORD}
    volumes:
      - type: volume
        source: caracol-postgres
        target: /var/lib/postgresql/18/docker
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caracol -d caracol"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - private

volumes:
  caracol-postgres:
    external: true
    name: ${CARACOL_POSTGRES_VOLUME:?Set CARACOL_POSTGRES_VOLUME to the existing production volume name}

networks:
  private:
    internal: true
  proxy:
    external: true
    name: dokploy-network
