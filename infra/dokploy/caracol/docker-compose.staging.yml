name: gamegamegame-caracol-hml

services:
  caracol:
    build:
      context: ../../..
      dockerfile: infra/docker/gamegamegame.Dockerfile
      args:
        GAME_APP: caracol
    environment:
      NODE_ENV: production
      GAME_SERVICE: caracol
      HOST: 0.0.0.0
      PORT: 3001
      PUBLIC_ORIGIN: https://hml-caracol.gamegamegame.site
      VITE_SERVER_URL: ""
      CARACOL_DATABASE_URL: postgresql://caracol_hml:caracol_hml@postgres:5432/caracol_hml
      CARACOL_VAPID_PUBLIC_KEY: ${CARACOL_HML_VAPID_PUBLIC_KEY:-}
      CARACOL_VAPID_PRIVATE_KEY: ${CARACOL_HML_VAPID_PRIVATE_KEY:-}
      CARACOL_VAPID_SUBJECT: ${CARACOL_HML_VAPID_SUBJECT:-mailto:hml@gamegamegame.site}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 8s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - private
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.gamegamegame-caracol-hml.rule: Host(`hml-caracol.gamegamegame.site`)
      traefik.http.routers.gamegamegame-caracol-hml.entrypoints: websecure
      traefik.http.routers.gamegamegame-caracol-hml.tls: "true"
      traefik.http.routers.gamegamegame-caracol-hml.tls.certresolver: letsencrypt
      traefik.http.services.gamegamegame-caracol-hml.loadbalancer.server.port: "3001"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caracol_hml
      POSTGRES_USER: caracol_hml
      POSTGRES_PASSWORD: ${CARACOL_HML_POSTGRES_PASSWORD:-caracol-hml-postgres-change-me}
    volumes:
      - type: volume
        source: caracol-hml-postgres
        target: /var/lib/postgresql/data
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caracol_hml -d caracol_hml"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - private

volumes:
  caracol-hml-postgres:
    external: true
    name: gamegamegame-staging-caracol-postgres

networks:
  private:
    internal: true
  proxy:
    external: true
    name: dokploy-network
