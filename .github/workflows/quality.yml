name: GameGameGame quality

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: Build and typecheck monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build all applications
        run: npm run build

      - name: Typecheck all applications
        run: npm run typecheck
